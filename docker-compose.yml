services:
  ring-drill:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsb-ring-drill:latest
    container_name: gsb-ring-drill
    ports:
      # Flask's conventional port and the common browser-drill port.
      - "5000:5000"
      - "8000:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
